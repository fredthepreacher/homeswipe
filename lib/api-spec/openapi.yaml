openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: listings
    description: Property listing operations
  - name: saved
    description: Saved listings operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /listings:
    get:
      operationId: getListings
      tags: [listings]
      summary: Get property listings
      description: Returns a list of property listings
      responses:
        "200":
          description: List of listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
  /listings/{id}/swipe:
    post:
      operationId: swipeListing
      tags: [listings]
      summary: Swipe on a listing
      description: Record a swipe action (save or reject) on a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwipeRequest"
      responses:
        "200":
          description: Swipe recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwipeResponse"
  /saved:
    get:
      operationId: getSavedListings
      tags: [saved]
      summary: Get saved listings
      description: Returns all listings saved by the user
      responses:
        "200":
          description: List of saved listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Listing:
      type: object
      properties:
        id:
          type: integer
        price:
          type: number
        address:
          type: string
        city:
          type: string
        state:
          type: string
        bedrooms:
          type: integer
        bathrooms:
          type: number
        sqft:
          type: integer
        imageUrl:
          type: string
        propertyType:
          type: string
        subtype:
          type: string
          nullable: true
        description:
          type: string
        saved:
          type: boolean
      required:
        - id
        - price
        - address
        - city
        - state
        - bedrooms
        - bathrooms
        - sqft
        - imageUrl
        - propertyType
        - description
        - saved
    SwipeRequest:
      type: object
      properties:
        direction:
          type: string
          enum: [left, right]
      required:
        - direction
    SwipeResponse:
      type: object
      properties:
        success:
          type: boolean
        saved:
          type: boolean
      required:
        - success
        - saved
