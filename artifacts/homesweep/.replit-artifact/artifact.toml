kind = "web"
previewPath = "/"
title = "HomeSweep – Real Estate Swipe App"
version = "1.0.0"
id = "artifacts/homesweep"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18753

[services.development]
run = "pnpm --filter @workspace/homesweep run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/homesweep", "run", "build" ]
publicDir = "artifacts/homesweep/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18753"
BASE_PATH = "/"
